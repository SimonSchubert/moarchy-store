# --- Omarchy shell plugins -------------------------------------------------
#
# Swept from plugins.omarchy.org (2410 listed) rather than picked by taste, and
# the filter is harsher than it looks:
#
#   1. 2087 of the 2410 are kind "bar widget", and mobileomarchy's bar hosts no
#      widgets at all -- summonBarWidget() returns false by design, because
#      upstream's widget host is ~1800 lines serving a pointer this device does
#      not have. So 87% of the marketplace cannot draw anything here, however
#      good it is. That is a bar limitation, not a judgement about the plugins.
#   2. Of the 70 most-engaged non-bar-widget plugins, 54 fail mechanically:
#      they `import Quickshell.Hyprland`, or call hyprctl for something beyond
#      the two options mobileomarchy's shim answers (decoration:rounding and
#      general:gaps_out). install/port-4x.sh translates the vendored shell, NOT
#      third-party plugins, so those break here with no fallback.
#   3. Of the 16 that pass, most are desktop-shaped for reasons no filter
#      catches: cursor-style picks a pointer theme on a device with no pointer;
#      quick-look and super-w-wait are keyboard gestures; theme-manager,
#      themebook, shell.settings and super-apps each duplicate a plugin
#      mobileomarchy already ships.
#
#   4. And one more that only hardware finds. Jot passed every check above,
#      installed cleanly, and drew a perfect full-width capture field at 360px
#      -- and could not be typed into. It has no TextInput or TextField at all:
#      it catches raw key events with Keys.onPressed and assembles the string
#      itself. Nothing ever requests text input, so the on-screen keyboard has
#      nothing to respond to and never rises. Beautiful, and unusable without a
#      hardware keyboard. Removed, and the criterion added below.
#
# What is left is below. Both are overlays -- a whole screen the shell summons,
# which is the one plugin shape that suits a phone -- and both have real text
# fields (note-note has 36 TextEdit and 10 TextField; clipboard-plus has 3), so
# the keyboard has something to rise for.
#
# Neither has been run on hardware, and there is one specific thing to look for
# when someone does. Both sit on WlrLayer.Overlay, while moarchy-keyboard sits
# on Top -- so an Overlay surface draws *over* the keyboard, and a full-screen
# scrim will swallow the taps meant for it. mobileomarchy.drawer solves exactly
# this by living on Top and reserving space for the keyboard instead (see the
# comment at Drawer.qml:431). Whether an Overlay plugin can be typed into at
# all is the open question these two entries carry.
#
# Icons are generic freedesktop names, not app icons: a plugin ships no packaged
# icon theme, so anything more specific would be a guess. Checked against the
# live theme rather than assumed -- the first attempt used document-edit and
# document-new, which Adwaita has and Yaru, the theme actually in use here, does
# not. The store falls back for its own rows either way; the drawer entry it
# writes has no fallback chain, so a wrong name there is a broken icon.

[[app]]
source = "plugin"
id = "io.github.andreivinca.note-note"
repo = "https://github.com/andreivinca/omarchy-note-note.git"
name = "Note Note"
category = "Notes"
toolkit = "quickshell"
summary = "Markdown notebooks, always editable and autosaved."
icon = "text-x-generic-symbolic"
tested = ""

[[app]]
source = "plugin"
id = "io.github.idr4n.clipboard-plus"
repo = "https://github.com/idr4n/omarchy-clipboard-plus.git"
name = "Clipboard Plus"
category = "System"
toolkit = "quickshell"
summary = "Clipboard history you can browse and edit by touch."
