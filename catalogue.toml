name = "Polari"
category = "Chat"
toolkit = "libadwaita"
summary = "IRC, with the networks listed for you. The only IRC client here, and it costs 2MB."
icon = "org.gnome.Polari"
screenshot = "polari-dark.png"
tested = "omarchy-mobile-vm"

