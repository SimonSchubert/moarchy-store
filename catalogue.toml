# --- Found by surveying the AUR ---------------------------------------------
#
# These three are repo packages, and that is the point of the detour. The AUR
# was swept for phone apps -- 119,247 packages, 277 of which name a Linux-phone
# project or link Kirigami -- and 51 of those turned out to exist in the
# official repos already. They had been missed here because the AppStream sweep
# (scripts/sweep-discover.py) can only see packages that ship metainfo, and
# these ship none. Nothing from the AUR itself is listed, and cannot be: the
# helper execs `pacman -S`, so an AUR entry would be a row with a button that
# cannot work. sweep/verdicts.toml records the whole survey.
#
# All three were run at 360x674 on 2026-09-12 and the screenshots are those
# runs. Only Komikku follows the theme; the two KDE apps draw their own light
# chrome under a dark shell, which is what `themed` in metadata.toml is for.

[[app]]
pkg = "komikku"
name = "Komikku"
category = "Reading"
toolkit = "libadwaita"
summary = "Manga and comics, online or downloaded for the train. Follows your theme."
icon = "info.febvre.Komikku"
screenshot = "komikku-dark.png"
tested = "omarchy-mobile-vm"

