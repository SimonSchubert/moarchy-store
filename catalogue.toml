# --- From LinuxPhoneApps.org, measured here ---------------------------------
#
# linuxphoneapps.org rates apps for mobile compatibility, and 193 of the ones it
# rates 4 or 5 are packaged in Arch. scripts/sweep-lpa.py joins its app ids to
# package names through the repo AppStream catalogue; sweep-measure.sh then ran
# each of these at 360x674 on 2026-09-12 and the screenshots are those runs.
#
# Their rating is not evidence for this device -- 5 there means it fits some
# phone, usually Phosh or Plasma Mobile, neither of which is what this runs.
# KleverNotes is rated 5 and clips at 360 here. So every entry below was looked
# at rather than imported.
#
# What the batch shows, over and over, is the cost of staying in one toolkit
# family: Tuba is Mastodon for 1.6MB where Tokodon is 108MB, Railway is a
# journey planner for one package, and File Shredder is 40KB. All of it is
# libadwaita on a GNOME-adjacent image, so almost nothing new is downloaded.

[[app]]
pkg = "railway"
name = "Railway"
category = "Travel"
toolkit = "libadwaita"
summary = "Public transport journeys: from, to, when. One package, already thumb-shaped."
icon = "de.schmidhuberj.DieBahn"
screenshot = "railway-dark.png"
tested = "omarchy-mobile-vm"

[[app]]
