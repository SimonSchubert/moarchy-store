# moarchy-store catalogue
#
# A curated list of Linux phone apps that genuinely work on a small screen.
# `pacman -Ss` already lists everything; the value here is the judgement about
# what survives 360x720 logical pixels and 2 GB of RAM.
#
# This file is ALSO the install allowlist. The privileged helper will only touch
# packages named here, so adding an app is a deliberate, reviewable act. See
# data/moarchy-store-helper.
#
# An entry is one of two things, and `source` says which:
#
#   source = "pacman"   (the default) an Arch package. Installed with privilege
#                       through the helper, so it must be in this allowlist.
#   source = "plugin"   an Omarchy shell plugin: a git repo of QML the shell
#                       loads into its own process. Installed as the user with
#                       `omarchy plugin add`, so it never reaches the helper.
#
# They share every other field, one set of categories, and one detail page, on
# purpose. Someone looking for a notes app does not care which mechanism
# delivers it.
#
# Fields:
#   source    "pacman" (default) or "plugin"
#   pkg       pacman only: package name in the official repos (aarch64)
#   id        plugin only: the id in the plugin's own manifest.json
#   repo      plugin only: https git URL, cloned verbatim by `omarchy plugin add`
#   name      display name
#   category  grouping in the UI
#   toolkit   libadwaita | kirigami | gtk | qt | tui | quickshell -- why it
#             adapts, or that it does not
#   summary   one line, written for someone deciding whether to install
#   icon      freedesktop icon name, taken from the app's own .desktop file --
#             not guessed. TUIs have no .desktop file, so they get a terminal icon.
#   screenshot  file in screenshots/, served from GitHub at runtime
#   tested    device string the entry was verified on, or "" if unverified
#
# "tested" is not decoration. An entry with an empty tested field is a
# suggestion; an entry with a device is a claim someone can hold us to.

version = 1

# Bumped on every publish. Clients refuse a remote catalogue whose serial is
# lower than the one they already trust, so a replayed older catalogue cannot
# quietly re-add something that was removed.
serial = 17

