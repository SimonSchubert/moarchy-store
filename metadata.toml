# moarchy-store display metadata
#
# Everything the detail page shows that is not needed to install anything.
# It is a separate file from catalogue.toml for one reason, and the reason is
# the whole security design:
#
#   catalogue.toml IS the install allowlist. data/moarchy-store-helper
#   re-parses it as root and refuses a copy that is not root-owned. Keeping it
#   a short list of package names keeps that list reviewable -- someone can
#   read the whole allowlist in one sitting and see what a password would
#   authorise.
#
#   This file never reaches the helper. It grows to several hundred entries of
#   prose, screenshots and sweep verdicts, and none of it can cause an install.
#
# Every field here is OPTIONAL, and so is this entire file. An app with no
# table renders exactly as it did before metadata.toml existed, and so does
# the whole store if the file is deleted. That is the same rule theme.py
# states for the palette: themed by the file's presence, never broken by its
# absence (moarchy docs/style.md, I2).
#
# Tables are keyed by ident -- the `pkg` of a package entry, or the `id` of a
# plugin entry -- matching catalogue.toml.
#
# Fields, and the one thing that produces each. Nothing here is guessed:
#
#   subtitle     what the app is, factual. AppStream <summary>.
#   description  full prose. AppStream <description>.
#   subcategory  the finer grain under catalogue.toml's category.
#   homepage     upstream. AppStream <url> or pacman's URL field.
#   features     what it supports, from the per-category vocabulary in
#                .claude/skills/catalogue-sweep. One flat list of strings for
#                every category, so the schema never varies by category --
#                only the vocabulary does, and lint-catalogue.py checks it.
#   released     date of the latest upstream release. AppStream <releases>.
#   releases_1y  releases in the twelve months before `released`.
#   cost_pkgs    packages `pacman -S` would download onto the stock image.
#   cost_mb      what those packages weigh. Both measured on a pristine image
#                before the sweep installs anything, because the cost of an
#                app is relative to what is already there.
#   adaptive     fits | clipped | no-window | unknown. Measured at 360x694.
#   themed       yes | no | partial | unknown. Whether the app follows
#                omarchy-theme-set. Measured by diffing the light and dark
#                shots, not inferred from the toolkit -- though only GTK apps
#                can pass, since the image ships gtk.css.tpl and gtk3.css.tpl
#                and no Qt template at all.
#   measured     where and when the sweep ran. Weaker evidence than
#                catalogue.toml's `tested`, and deliberately a separate word.
#   shots        screenshots in screenshots/, one per theme mode.
#
# version is this file's own schema, independent of catalogue.toml's serial:
# nothing here is an allowlist, so there is nothing to roll back.
version = 1

