# ===========================================================================
# LinuxPhoneApps.org, cross-referenced and measured, 2026-09-12
#
# linuxphoneapps.org is the closest thing to an authority on which Linux
# applications work on a phone, and unlike the other two sources it publishes
# the judgement rather than only the list: every entry carries a
# mobile_compatibility rating where 5 means "fits the screen and works fine
# with touch input", plus the distributions that package it. 795 apps, 672 of
# them rated 5, 219 packaged in Arch.
#
# scripts/sweep-lpa.py joins its app ids to package names through the repo
# AppStream catalogue and drops what is already judged here, which left 103.
# Twenty-six of those are now listed.
#
# Their rating is not evidence for this device. 5 there means it fits some
# phone at some width on some image, usually Phosh or Plasma Mobile, and this
# runs neither. KleverNotes is rated 5 there and clips at 360x674 here. Every
# entry below was looked at.
#
# Costs are from scripts/sweep-cost.sh in one pass, against an image with 840
# packages installed.
# ===========================================================================

# --- Measured and not listed -----------------------------------------------

