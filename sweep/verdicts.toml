# Every app this project has ever examined, and what came of it.
#
# catalogue.toml says what we ship. This says what we looked at -- which is a
# bigger list, and the more useful one to a future sweep, because the expensive
# part of adding an app is discovering it does not work. Without this file that
# discovery lives only in a commit message, and the next sweep pays for it
# again.
#
# The project already worked this way by hand: commit 13bf411 lists what the
# 340-package sweep deliberately skipped, and the comment block at the foot of
# catalogue.toml records the 2410 -> 2 plugin sweep in prose. This generalises
# both so scripts/sweep-discover.sh can skip what has already been judged.
#
# outcome:
#   listed     it is in catalogue.toml
#   rejected   examined and not shipped. `reason` is then required.
#   deferred   worth another look when something changes -- `reason` says what.
#
# A rejection is not permanent. It is a record of what was true on a date, and
# `date` is there so a three-year-old "no" can be re-asked.

# --- Measured at 360px in the VM, 2026-09-12 (catalogue serial 7) -----------
#
# The three libadwaita messengers, run at a 360x674 panel. All three map a
# window at exactly that size and draw correctly in it. What the run turned up
# was not about layout at all.

[chatty]
date     = 2026-09-12
outcome  = "listed"
adaptive = "fits"
reason   = """
Never launches from the drawer as shipped. Its entry is DBusActivatable, its
D-Bus service names a systemd unit carrying Requisite=gnome-session-initialized
.target, and outside a GNOME session that target does not exist -- so systemd
refuses the unit and the launch fails silently: no window, no process, and
gtk-launch still exiting 0. A user entry with DBusActivatable=false fixes it,
3 launches out of 3 with one and 0 out of 3 without. This belongs to the image
rather than to the app.
"""

[fractal]
date     = 2026-09-12
outcome  = "listed"
adaptive = "fits"
reason   = """
Hangs where no keyring is unlocked: it wants org.freedesktop.secrets and the
gcr prompt maps behind Fractal's own window, so it sits on "Fetching Account
Data..." with nothing to click. Given a keyring it reaches its login screen and
launches from the drawer normally. Geary has the same dependency and will have
the same problem.
"""

[dino]
date     = 2026-09-12
outcome  = "listed"
adaptive = "fits"
reason   = """
Aborted once, on its first launch ever, in the OMEMO plugin's SQLite init.
Three later first-runs with its data directory wiped, through the drawer and
directly, all started fine. Recorded rather than diagnosed.
"""

