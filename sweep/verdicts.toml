# ===========================================================================
# The AUR survey, 2026-09-12
#
# 119,247 AUR packages read from packages-meta-ext-v1.json.gz. The AUR ships no
# AppStream data, so unlike the repo sweep there is no <display_length> to read
# and the filter has to infer from dependencies, description and keywords:
# scripts/sweep-aur.py.
#
# 277 packages either name a Linux-phone project (PinePhone, Phosh, Plasma
# Mobile, postmarketOS, Mobian, Ubuntu Touch, sxmo, Librem 5) or link Kirigami,
# once shell components, kernels, firmware and flashing tools are removed.
#
# The finding that mattered was not an AUR app at all: 51 of those 277 names
# exist in the official repos. They had been missed here because
# scripts/sweep-discover.py can only see packages that ship AppStream metainfo,
# and these ship none -- the same blind spot that leaves kclock, plasma-dialer,
# spacebar, livi and portfolio-file-manager without metadata today. Searching
# the AUR turned out to be a way of finding repo packages.
#
# Nothing from the AUR itself is listed, and this is structural rather than a
# judgement about quality: data/moarchy-store-helper execs `/usr/bin/pacman -S`,
# so an AUR package cannot be installed through the store at all, and the
# allowlist cannot cover it. Building one means makepkg running arbitrary
# PKGBUILD code, which is a different privilege question from the one the polkit
# action answers. The VM also has no base-devel, rust, meson or ninja, so
# nothing here was built or run.
#
# Costs below are from scripts/sweep-cost.sh, taken in one pass against an image
# with 840 packages installed. That matters: measured serially, klevernotes cost
# 38 packages on a fresh image and 25 an hour later, the same app the same day.
# ===========================================================================

