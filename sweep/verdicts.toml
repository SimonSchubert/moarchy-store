#
# 2410 plugins listed on plugins.omarchy.org, 2 listed here. The full reasoning
# is at the foot of catalogue.toml; only the per-plugin verdicts are repeated.

[io_github_yordanbuilds_jot]
date    = 2026-09-01
outcome = "rejected"
reason  = """
Passed every static check, installed cleanly and drew a perfect full-width
capture field at 360px -- and could not be typed into. It has no TextInput or
TextField at all: it catches raw key events with Keys.onPressed and assembles
the string itself, so nothing ever requests text input and the on-screen
keyboard never rises. Unusable without a hardware keyboard, and not a thing any
static check catches. This is why `tested` exists.
"""

